name: test

on:
  push:
  pull_request:

jobs:
  suite:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: sensitive-string gate
        run: bash scripts/public-hygiene.sh
      - name: cortex-loop suite
        run: bash bin/cortex-loop-tests/suite.sh
